<html>
<head>
<meta name="viewport" content="width=device-width">
</head>
<style>
</style>
<body style="background-color:black">
<p style="font-weight:bold;text-align:center;color:red;">WELCOME TO MY <span style="color:white;">CRUD</span></p>

<h1>Products</h1>

<!-- CREATE -->
<form method="POST" action="{{ url_for('index') }}">
<input type="text" name="name" placeholder="Product name" required>
<button type="submit">Add</button>
</form>

<ul>
{% for p in products %}
<li>
<!--UPDATE-->
<form method="POST" action="{{ url_for('update', id=p.id) }}" style="display:inline">
<input type="text" name="name" value="{{ p.name }}" required>
<button type="submit">Save</button>
</form>

<!--DELETE-->
<form method="POST" action="{{ url_for('delete', id=p.id) }}" style="display:inline">
<button type="submit">Delete</button>
</form>
</li>
{% endfor %}
</ul>

</body>
</html>
